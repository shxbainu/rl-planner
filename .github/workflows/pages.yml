# Deploys the site to GitHub Pages on every push, and hourly to refresh news and Muse's homework/fantasy files.
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
    # the morning briefing: 6:35am EST (7:35 EDT); the hourly runs retry it if this one misses
    - cron: "35 10 * * *"
  workflow_dispatch:
    inputs:
      briefing:
        description: "Rewrite today's AI briefing now"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch headlines
        run: python tools/fetch_news.py news.json
      - name: Fetch the lunch menu
        continue-on-error: true
        run: python tools/fetch_menu.py menu.json || true
      # once a day: an AI summary of those headlines (needs the ANTHROPIC_API_KEY secret; skips itself without it)
      - name: Morning briefing
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then pip install -q anthropic; fi
          python tools/summarize_news.py news.json news_summary.json ${{ inputs.briefing && '--force' || '' }} || true
      - name: Pull latest homework and fantasy from Crosswalk
        env:
          CROSSWALK_KEY: ${{ secrets.CROSSWALK_KEY }}
        run: python tools/pull_crosswalk.py
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html style.css app.js sync.js firebase-config.js schedule.json homework.json fantasy.json links.json news.json _site/
          if [ -f news_summary.json ]; then cp news_summary.json _site/; fi
          if [ -f menu.json ]; then cp menu.json _site/; fi
          cp -r themes _site/themes
          # version the asset links so browsers don't keep a stale script after a deploy
          v="${GITHUB_SHA::7}"
          sed -i "s#href=\"style.css\"#href=\"style.css?v=$v\"#; s#src=\"app.js\"#src=\"app.js?v=$v\"#; s#__V__#$v#g" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
