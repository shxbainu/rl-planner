# Deploys the site to GitHub Pages on every push, and hourly to refresh news and Muse's homework/fantasy files.
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch headlines
        run: python tools/fetch_news.py news.json
      - name: Pull latest homework and fantasy from Crosswalk
        env:
          CROSSWALK_KEY: ${{ secrets.CROSSWALK_KEY }}
        run: python tools/pull_crosswalk.py
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html style.css app.js schedule.json homework.json fantasy.json news.json _site/
          cp -r themes _site/themes
          # version the asset links so browsers don't keep a stale script after a deploy
          v="${GITHUB_SHA::7}"
          sed -i "s#href=\"style.css\"#href=\"style.css?v=$v\"#; s#src=\"app.js\"#src=\"app.js?v=$v\"#; s#__V__#$v#g" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
